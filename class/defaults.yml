parameters:
  airlock_microgateway:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true

    debug: false

    images:
      nginx:
        registry: 'ghcr.io'
        repository: 'nginx/nginx-unprivileged'
        tag: '1.31.10-alpine3.24'


    monitoring:
      namespace:
        metadata:
          name: "airlock-microgateway-monitoring"
          labels:
            openshift.io/cluster-monitoring: 'true'

      enabled: false
      sessionMonitoring:
        enabled: false
      blackboxExporter:
        enabled: false
      espejoteReconcileErrors:
        enabled: true
        minutesThreshold: 31
        annotations:
          summary: 'espejote failed to reconcile ManagedResource {{ $labels.managedresource }} in namespace {{ $labels.namespace }}'
          description: 'The ManagedResource {{ $labels.managedresource }} in namespace {{ $labels.namespace }} has not been Ready for 30 minutes. Last reported status: {{ $labels.status }}. The full error message is in the ManagedResource events: kubectl -n {{ $labels.namespace }} describe managedresource {{ $labels.managedresource }}'
        labels:
          severity: 'warning'
        for: 5m
      dummyBackend:
        enabled: false
        nodeSelector: {}
        containers:
          nginx: {}
        deployment:
          metadata: {}
          spec: {}
        tls:
          enabled: false
    operatorNamespace: ""
    default:
      namespace:
        labels: {}
        annotations: {}
      redisSecretSync:
        enabled: false
        sourceNamespace: vshn-airlock-redis
        updateRedisProvider:
          host: true
          username: true
        secrets:
          redis: redis-creds-connection
      gateway: {}
      gatewayParameters:
        spec:
          kubernetes:
            deployment:
              replicas: 2
      pdb: {}
      redisProvider: {}
      sessionHandling: {}
      egressNetpol: {}
      httpRedirect: {}
      customResponses: {}
    instances: {}
