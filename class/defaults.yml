parameters:
  airlock_microgateway:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true

    debug: false

    images:
      nginx:
        registry: 'ghcr.io'
        repository: 'nginx/nginx-unprivileged'
        tag: '1.31.2-alpine3.23'


    monitoring:
      namespace:
        metadata:
          name: "airlock-microgateway-monitoring"
          labels:
            openshift.io/cluster-monitoring: 'true'

      enabled: false
      sessionMonitoring:
        enabled: false
      blackboxExporter:
        enabled: false
      dummyBackend:
        enabled: false
        nodeSelector: {}
        containers:
          nginx: {}
        deployment:
          metadata: {}
          spec: {}
        tls:
          enabled: false
    operatorNamespace: ""
    default:
      namespace:
        labels: {}
        annotations: {}
      gateway: {}
      gatewayParameters:
        spec:
          kubernetes:
            deployment:
              replicas: 2
      pdb: {}
      redisProvider: {}
      sessionHandling: {}
      egressNetpol: {}
      httpRedirect: {}
      customResponses: {}
    instances: {}
