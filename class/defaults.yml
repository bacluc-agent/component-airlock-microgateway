parameters:
  airlock_microgateway:
    =_metadata:
      multi_tenant: true
      multi_instance: true
      multi_version: true

    debug: false

    images:
      nginx:
        registry: 'ghcr.io'
        repository: 'nginx/nginx-unprivileged'
        tag: '1.31.10-alpine3.24'


    monitoring:
      namespace:
        metadata:
          name: "airlock-microgateway-monitoring"
          labels:
            openshift.io/cluster-monitoring: 'true'

      enabled: false
      sessionMonitoring:
        enabled: false
      blackboxExporter:
        enabled: false
      dummyBackend:
        enabled: false
        nodeSelector: {}
        containers:
          nginx: {}
        deployment:
          metadata: {}
          spec: {}
        tls:
          enabled: false
    operatorNamespace: ""
    default:
      namespace:
        labels: {}
        annotations: {}
      redisSecretSync:
        enabled: false
        sourceNamespace: vshn-airlock-redis
        secrets:
          redis-password:
            redis.password:
              secretName: redis-creds-connection
              key: REDIS_PASSWORD
          redis-ca:
            ca.crt:
              secretName: redis-creds-connection
              key: ca.crt
          redis-clientcert:
            type: kubernetes.io/tls
            tls.crt:
              secretName: redis-creds-connection
              key: tls.crt
            tls.key:
              secretName: redis-creds-connection
              key: tls.key
      gateway: {}
      gatewayParameters:
        spec:
          kubernetes:
            deployment:
              replicas: 2
      pdb: {}
      redisProvider: {}
      sessionHandling: {}
      egressNetpol: {}
      httpRedirect: {}
      customResponses: {}
    instances: {}
