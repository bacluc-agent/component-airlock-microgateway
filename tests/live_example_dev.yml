applications:
  - airlock-microgateway
  - cilium
  - gateway-api

parameters:
  # Dependency for testing with upstream lib
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-airlock-microgateway-operator/master/lib/airlock-microgateway-operator.libsonnet
        output_path: vendor/lib/airlock-microgateway-operator.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet
  airlock_microgateway:
    debug: true
    default:
      gateway:
      gatewayParameters:
        spec:
          defaults:
            customResponses:
              local:
                - statusCodeCondition:
                    matcher:
                      exact: 401
                  customResponseRef:
                    name: "401"
                - statusCodeCondition:
                    matcher:
                      exact: 403
                  customResponseRef:
                    name: "403"
                - statusCodeCondition:
                    matcher:
                      exact: 404
                  customResponseRef:
                    name: "404"
                - statusCodeCondition:
                    matcher:
                      range:
                        from: 400
                        to: 499
                  customResponseRef:
                    name: "4xx"
                - statusCodeCondition:
                    matcher:
                      exact: 502
                  customResponseRef:
                    name: "502"
                - statusCodeCondition:
                    matcher:
                      range:
                        from: 500
                        to: 599
                  customResponseRef:
                    name: "5xx"
              upstream:
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 401
                  customResponseRef:
                    name: "401"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 403
                  customResponseRef:
                    name: "403"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 404
                  customResponseRef:
                    name: "404"
                - responseConditions:
                    statusCode:
                      matcher:
                        range:
                          start: 400
                          end: 499
                  customResponseRef:
                    name: "4xx"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 502
                  customResponseRef:
                    name: "502"
                - responseConditions:
                    statusCode:
                      matcher:
                        range:
                          start: 500
                          end: 599
                  customResponseRef:
                    name: "5xx"
      pdb:
      redisProvider:
      sessionHandling:
      egressNetpol:
      httpRedirect:
      customResponses:
        "401":
          content:
            - contentType: text/html
              body:
                value: |
                  <!DOCTYPE html>
                  <html lang="de">
                  <head>
                      <meta charset="utf-8">
                      <meta name="viewport" content="width=device-width, initial-scale=1.0">
                      <title>Customer Error 401</title>
                      <style>
                          @media (max-height: 550px) {
                              body { overflow-y: auto; height: auto; }
                          }
                      </style>
                  </head>
                  <body>
                  <main>
                      <h1><span class="textcode">Error </span>401</h1>
                      <section>
                        <h2 lang="de">Access Denied</h2>
                        <p lang="de">You can't access this application.<br>
                        Additional info: <a href="https://support.customer.com">Support</a>.</p>
                      </section>
                  </main>
                  <footer>
                      REQUEST ID: %STREAM_ID%
                  </footer>
                  </body>
                  </html>
              headers:
        "403":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "404":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "4xx":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "502":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "5xx":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
  live_example_dev:
    instances:
      vshn-airlock-dev-01:
        gateway:
          metadata:
            annotations:
              airlock-microgateway.appuio.io/httproute-default-cluster-issuer: digicert-ev
          spec:
            gatewayClassName: microgateway-cloudscale
            infrastructure:
              parametersRef:
                group: microgateway.airlock.com
                kind: GatewayParameters
            listeners:
              - name: http-default
                protocol: HTTP
                port: 80
        gatewayParameters:
          spec:
            defaults:
              downstream:
                remoteIP:
                  proxyProtocol: {}
            features:
              envoyExtensionPolicyEnabled: true
              insecureTLSAllowed: true
            kubernetes:
              deployment:
                automountServiceAccountToken: false
                engineContainer:
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      cpu: 1
                      memory: 512Mi
                placement:
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchExpressions:
                              - key: gateway.networking.k8s.io/gateway-name
                                operator: In
                                values:
                                  - "vshn-airlock-dev-01"
                          topologyKey: kubernetes.io/hostname
                  nodeSelector:
                    node-role.kubernetes.io/infra: ''
                replicas: 3
              service:
                # 1.1.1.1: Jumphost 1
                # 1.1.1.2: Jumphost 2
                # 1.1.1.3: NAT-Address Test Infra
                annotations:
                  k8s.cloudscale.ch/loadbalancer-listener-allowed-cidrs: '["42.65.119.49/32", "9b2f:48d7:fad1:7a1c::178/128"]'
                  k8s.cloudscale.ch/loadbalancer-pool-protocol: proxyv2
                  k8s.cloudscale.ch/loadbalancer-floating-ips: '["46.246.132.110/32","9b2f:7a1c:fad1/128"]'
                  k8s.cloudscale.ch/loadbalancer-name: 'ingress-dev-01'
                externalTrafficPolicy: Local
                type: LoadBalancer
            logging:
              level: info
        pdb:
          spec:
            minAvailable: 1
            selector:
              matchLabels:
                "gateway.networking.k8s.io/gateway-name": vshn-airlock-dev-01
            unhealthyPodEvictionPolicy: IfHealthyBudget
        redisProvider:
          metadata:
            name: redis-provider
          spec:
            auth:
              password:
                secretRef:
                  name: redis-password
              username: default
            mode:
              standalone:
                host: redis-master.vshn-redis-redis-58ztv.svc.cluster.local
                port: 6379
            timeouts:
              connect: 10s
              maxDuration: 2s
            tls:
              certificateVerification:
                custom:
                  trustedCA:
                    certificates:
                      - secretRef:
                          name: redis-ca
              clientCertificate:
                secretRef:
                  name: redis-clientcert
        sessionHandling:
          metadata:
            name: redis-session
          spec:
            mode: Enforce
            defaultTimeouts:
              # Specify idle timeout of a session
              idle: 135m # 2h 15m
              # Specify maximum lifetime of a session
              lifetime: 735m # 12h 15m
            cookie:
              name: CUSTOMER_SESS
        egressNetpol:
          metadata:
            name: microgateway-egress
          spec:
            podSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-class-name: microgateway-cloudscale
            policyTypes: [Egress]
            egress:
              # allow Microgateway Operator
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: syn-airlock-microgateway
                ports:
                  - port: 13377
                    protocol: TCP
              # allow DNS
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: openshift-dns
                ports:
                  - port: 5353
                    protocol: UDP
              # allow sessionhandling (redis)
              - to:
                  - namespaceSelector:
                      matchLabels:
                        appcat.vshn.io/claim-namespace: vshn-airlock-redis
                ports:
                  - port: 6379
                    protocol: TCP
              # allow broker(keycloak)
              - to:
                  - namespaceSelector:
                      matchLabels:
                        appcat.vshn.io/claim-namespace: broker-preprod
                ports:
                  - port: 8080
                    protocol: TCP
                  - port: 8443
                    protocol: TCP
              # Customer specific
              - to: ### Testing only
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: customer-arch-test
                ports:
                  - port: 3000
                    protocol: TCP
              - to:
                  - ipBlock:
                      cidr: 1.1.1.1/32
                ports:
                  - port: 443
                    protocol: TCP
              - to:
                  - ipBlock:
                      cidr: 1.1.1.2/32
                ports:
                  - port: 443
                    protocol: TCP
              - to:
                  - ipBlock:
                      cidr: 1.1.1.3/32
                ports:
                  - port: 443
                    protocol: TCP
              - to:
                  - ipBlock:
                      cidr: 1.1.1.4/32
                ports:
                  - port: 80
                    protocol: TCP
              - to:
                  - ipBlock:
                      cidr: 1.1.1.5/32
                ports:
                  - port: 8080
                    protocol: TCP
              # Customer Applications
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: qa-airlock-gateway
                ports:
                  - port: 1080
                    protocol: TCP
        httpRedirect:
          metadata:
            name: http-filter-redirect
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                sectionName: http-default
            hostnames:
              - '*.customer.ch'
            rules:
              - matches:
                  - method: GET
                    path:
                      type: PathPrefix
                      value: /
                filters:
                  - type: RequestRedirect
                    requestRedirect:
                      scheme: https
                      statusCode: 301
