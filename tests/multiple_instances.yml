applications:
  - airlock-microgateway
  - cilium
  - gateway-api

parameters:
  # Dependency for testing with upstream lib
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-airlock-microgateway-operator/master/lib/airlock-microgateway-operator.libsonnet
        output_path: vendor/lib/airlock-microgateway-operator.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet
  airlock_microgateway:
    debug: true
    default:
      gatewayParameters:
        spec:
          defaults:
            customResponses:
              local:
                - statusCodeCondition:
                    matcher:
                      exact: 401
                  customResponseRef:
                    name: "401"
                - statusCodeCondition:
                    matcher:
                      exact: 403
                  customResponseRef:
                    name: "403"
                - statusCodeCondition:
                    matcher:
                      exact: 404
                  customResponseRef:
                    name: "404"
                - statusCodeCondition:
                    matcher:
                      range:
                        from: 400
                        to: 499
                  customResponseRef:
                    name: "4xx"
                - statusCodeCondition:
                    matcher:
                      exact: 502
                  customResponseRef:
                    name: "502"
                - statusCodeCondition:
                    matcher:
                      range:
                        from: 500
                        to: 599
                  customResponseRef:
                    name: "5xx"
              upstream:
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 401
                  customResponseRef:
                    name: "401"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 403
                  customResponseRef:
                    name: "403"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 404
                  customResponseRef:
                    name: "404"
                - responseConditions:
                    statusCode:
                      matcher:
                        range:
                          start: 400
                          end: 499
                  customResponseRef:
                    name: "4xx"
                - responseConditions:
                    statusCode:
                      matcher:
                        exact: 502
                  customResponseRef:
                    name: "502"
                - responseConditions:
                    statusCode:
                      matcher:
                        range:
                          start: 500
                          end: 599
                  customResponseRef:
                    name: "5xx"
      namespace:
        labels:
          appuio.ch/waf: airlock
          vshn.microgateway/redis-sync-secret: "true"
      gateway:
        spec:
          gatewayClassName: test-default
          listeners:
            - allowedRoutes:
                namespaces:
                  from: default
              name: default
              port: 80
              protocol: default
      pdb:
        spec:
          minAvailable: 1
          selector:
            matchLabels:
              "gateway.networking.k8s.io/gateway-name": vshn-instances-test-01
          unhealthyPodEvictionPolicy: IfHealthyBudget
      redisProvider:
        spec:
          auth:
            password:
              secretRef:
                name: redis-password
            username: default
          mode:
            standalone:
              host: redis-master
              port: 6379
          timeouts:
            connect: 10s
            maxDuration: 2s
          tls:
            certificateVerification:
              custom:
                trustedCA:
                  certificates:
                    - secretRef:
                        name: redis-ca
            clientCertificate:
              secretRef:
                name: redis-clientcert
      sessionHandling:
        spec:
          auth:
            password:
              secretRef:
                name: redis-password
            username: default
          mode:
            standalone:
              host: redis-master
              port: 6379
          timeouts:
            connect: 10s
            maxDuration: 2s
          tls:
            certificateVerification:
              custom:
                trustedCA:
                  certificates:
                    - secretRef:
                        name: redis-ca
            clientCertificate:
              secretRef:
                name: redis-clientcert
      egressNetpol:
        spec:
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-class-name: microgateway-cloudscale
          policyTypes: [Egress]
          egress:
            # allow Microgateway Operator
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: syn-airlock-microgateway
              ports:
                - port: 13377
                  protocol: TCP
      httpRedirect:
        metadata:
          name: http-filter-redirect
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              sectionName: http-default
          hostnames:
            - "*.test.com"
          rules:
            - matches:
                - method: GET
                  path:
                    type: PathPrefix
                    value: /
              filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
      customResponses:
        "401":
          content:
            - contentType: text/html
              body:
                value: |
                  <!DOCTYPE html>
                  <html lang="de">
                  <head>
                      <meta charset="utf-8">
                      <meta name="viewport" content="width=device-width, initial-scale=1.0">
                      <title>Customer Error 401</title>
                      <style>
                          @media (max-height: 550px) {
                              body { overflow-y: auto; height: auto; }
                          }
                      </style>
                  </head>
                  <body>
                  <main>
                      <h1><span class="textcode">Error </span>401</h1>
                      <section>
                        <h2 lang="de">Access Denied</h2>
                        <p lang="de">You can't access this application.<br>
                        Additional info: <a href="https://support.customer.com">Support</a>.</p>
                      </section>
                  </main>
                  <footer>
                      REQUEST ID: %STREAM_ID%
                  </footer>
                  </body>
                  </html>
              headers: {}
        "403":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "404":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "4xx":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "502":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%
        "5xx":
          content:
            - contentType: text/html
              body:
                value: |
                  %RESPONSE_CODE%

  multiple_instances:
    default:
      gateway:
        spec:
          gatewayClassName: test-default
          listeners:
            - allowedRoutes:
                namespaces:
                  from: default
              name: default
              port: 80
              protocol: default
      gatewayParameters:
        spec:
          defaults:
            downstream:
              remoteIP:
                proxyProtocol: {}
          features:
            envoyExtensionPolicyEnabled: true
            insecureTLSAllowed: true
          kubernetes:
            deployment:
              automountServiceAccountToken: false
              engineContainer:
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 1
                    memory: 512Mi
              placement:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchExpressions:
                            - key: gateway.networking.k8s.io/gateway-name
                              operator: In
                              values:
                                - "vshn-instances-test-01"
                        topologyKey: kubernetes.io/hostname
                nodeSelector:
                  node-role.kubernetes.io/infra: ""
              replicas: 2
    instances:
      test-instance-01:
        gateway:
          spec:
            gatewayClassName: test-instances-01
            listeners:
              - allowedRoutes:
                  namespaces:
                    from: All
                name: http
                port: 80
                protocol: HTTP
        gatewayParameters:
          spec:
            kubernetes:
              deployment:
                placement:
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchExpressions:
                              - key: gateway.networking.k8s.io/gateway-name
                                operator: In
                                values:
                                  - "vshn-instances-test-01"
                          topologyKey: kubernetes.io/hostname
                  nodeSelector:
                    node-role.kubernetes.io/test: ""
      test-instance-02: {}
      test-instance-overriding-customResponses:
        gatewayParamters:
          spec:
            defaults:
              customResponses:
                local:
                  - statusCodeCondition:
                      matcher:
                        exact: 301
                    customResponseRef:
                      name: "301"
        customResponses:
          "403":
            content:
              - contentType: text/html
                body:
                  value: |
                    OVERRIDDENT CONTENT
              - contentType: application/json
                body:
                  value: |
                    {"json": "is also possible"}
          "301":
            content:
              - contentType: text/html
                body:
                  value: |
                    Redirect
