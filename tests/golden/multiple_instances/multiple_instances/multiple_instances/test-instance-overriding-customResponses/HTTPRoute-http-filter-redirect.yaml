apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-filter-redirect
  namespace: test-instance-overriding-customResponses
spec:
  hostnames:
    - '*.test.com'
  parentRefs:
    - name: explicit-gateway
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
      matches:
        - method: GET
          path:
            type: PathPrefix
            value: /
