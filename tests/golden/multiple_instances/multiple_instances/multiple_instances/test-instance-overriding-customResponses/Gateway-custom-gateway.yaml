apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: custom-gateway
  namespace: test-instance-overriding-customResponses
spec:
  gatewayClassName: test-default
  infrastructure:
    parametersRef:
      group: microgateway.airlock.com
      kind: GatewayParameters
      name: custom-gateway-parameters
  listeners:
    - allowedRoutes:
        namespaces:
          from: default
      name: default
      port: 80
      protocol: default
    - allowedRoutes:
        namespaces:
          from: default
      name: default
      port: 80
      protocol: default
