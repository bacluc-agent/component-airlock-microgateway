apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-world
  namespace: test-instance-overriding-customResponses
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: custom-gateway
      microgateway.airlock.com/managedBy: ''
  ingress:
    - fromEntities:
        - world
