apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    gateway.networking.k8s.io/gateway-name: test-instance-overriding-customResponses
  name: test-instance-overriding-customResponses
  namespace: test-instance-overriding-customResponses
spec:
  minAvailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: vshn-instances-test-01
  unhealthyPodEvictionPolicy: IfHealthyBudget
