apiVersion: v1
data:
  debug: |
    customResponses:
      "301":
        customResponses:
          text/html:
            body:
              value: |
                Redirect
        matcher:
          exact: 301
      "401":
        customResponses:
          text/html:
            body:
              value: |
                <!DOCTYPE html>
                <html lang="de">
                <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Customer Error 401</title>
                    <style>
                        @media (max-height: 550px) {
                            body { overflow-y: auto; height: auto; }
                        }
                    </style>
                </head>
                <body>
                <main>
                    <h1><span class="textcode">Error </span>401</h1>
                    <section>
                      <h2 lang="de">Access Denied</h2>
                      <p lang="de">You can't access this application.<br>
                      Additional info: <a href="https://support.customer.com">Support</a>.</p>
                    </section>
                </main>
                <footer>
                    REQUEST ID: %STREAM_ID%
                </footer>
                </body>
                </html>
            headers: {}
        matcher:
          exact: 401
      "403":
        content:
        - body:
            value: |
              OVERRIDDENT CONTENT
          contentType: "text/html"
        - body:
            value: |
              {"json": "is also possible"}
          contentType: "application/json"
        customResponses:
          text/html:
            body:
              value: |
                %RESPONSE_CODE%
        matcher:
          exact: 403
      "404":
        customResponses:
          text/html:
            body:
              value: |
                %RESPONSE_CODE%
        matcher:
          exact: 404
      4xx:
        customResponses:
          text/html:
            body:
              value: |
                %RESPONSE_CODE%
        matcher:
          range:
            from: 400
            to: 499
      "502":
        customResponses:
          text/html:
            body:
              value: |
                %RESPONSE_CODE%
        matcher:
          exact: 502
      5xx:
        customResponses:
          text/html:
            body:
              value: |
                %RESPONSE_CODE%
        matcher:
          range:
            from: 500
            to: 599
    egressNetpol:
      spec:
        egress:
        - ports:
          - port: 13377
            protocol: "TCP"
          to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: "syn-airlock-microgateway"
        podSelector:
          matchLabels:
            gateway.networking.k8s.io/gateway-class-name: "microgateway-cloudscale"
        policyTypes:
        - "Egress"
    gateway:
      spec:
        gatewayClassName: "test-default"
        listeners:
        - allowedRoutes:
            namespaces:
              from: "default"
          name: "default"
          port: 80
          protocol: "default"
        - allowedRoutes:
            namespaces:
              from: "default"
          name: "default"
          port: 80
          protocol: "default"
    gatewayParameters:
      spec:
        defaults:
          customResponses: {}
          downstream:
            remoteIP:
              proxyProtocol: {}
        features:
          envoyExtensionPolicyEnabled: true
          insecureTLSAllowed: true
        kubernetes:
          deployment:
            automountServiceAccountToken: false
            engineContainer:
              resources:
                limits:
                  cpu: 1
                  memory: "512Mi"
                requests:
                  cpu: "100m"
                  memory: "256Mi"
            placement:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                      - key: "gateway.networking.k8s.io/gateway-name"
                        operator: "In"
                        values:
                        - "vshn-instances-test-01"
                    topologyKey: "kubernetes.io/hostname"
              nodeSelector:
                node-role.kubernetes.io/infra: ""
            replicas: 2
    httpRedirect:
      metadata:
        name: "http-filter-redirect"
      spec:
        hostnames:
        - "*.test.com"
        parentRefs:
        - group: "gateway.networking.k8s.io"
          kind: "Gateway"
          sectionName: "http-default"
        rules:
        - filters:
          - requestRedirect:
              scheme: "https"
              statusCode: 301
            type: "RequestRedirect"
          matches:
          - method: "GET"
            path:
              type: "PathPrefix"
              value: "/"
    namespace:
      annotations: {}
      labels:
        appuio.ch/waf: "airlock"
        vshn.microgateway/redis-sync-secret: "true"
    pdb:
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            gateway.networking.k8s.io/gateway-name: "vshn-instances-test-01"
        unhealthyPodEvictionPolicy: "IfHealthyBudget"
    redisProvider:
      spec:
        auth:
          password:
            secretRef:
              name: "redis-password"
          username: "default"
        mode:
          standalone:
            host: "redis-master"
            port: 6379
        timeouts:
          connect: "10s"
          maxDuration: "2s"
        tls:
          certificateVerification:
            custom:
              trustedCA:
                certificates:
                - secretRef:
                    name: "redis-ca"
          clientCertificate:
            secretRef:
              name: "redis-clientcert"
    sessionHandling:
      spec:
        auth:
          password:
            secretRef:
              name: "redis-password"
          username: "default"
        mode:
          standalone:
            host: "redis-master"
            port: 6379
        timeouts:
          connect: "10s"
          maxDuration: "2s"
        tls:
          certificateVerification:
            custom:
              trustedCA:
                certificates:
                - secretRef:
                    name: "redis-ca"
          clientCertificate:
            secretRef:
              name: "redis-clientcert"
kind: ConfigMap
metadata:
  labels:
    name: debug-configmap
  name: debug-configmap
  namespace: test-instance-overriding-customResponses
