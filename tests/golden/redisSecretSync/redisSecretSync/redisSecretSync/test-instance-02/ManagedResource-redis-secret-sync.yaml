apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    description: Copies the redis connection secrets into the airlock-microgateway
      instance namespace and updates the RedisProvider host and username
  name: redis-secret-sync
  namespace: test-instance-02
spec:
  context:
    - name: source_secret_0
      resource:
        apiVersion: v1
        kind: Secret
        name: redis-auth
        namespace: vshn-airlock-redis
    - name: source_secret_1
      resource:
        apiVersion: v1
        kind: Secret
        name: redis-tls
        namespace: vshn-airlock-redis
    - name: redis_provider
      resource:
        apiVersion: microgateway.airlock.com/v1alpha1
        kind: RedisProvider
        name: test-instance-02
        namespace: test-instance-02
    - name: redis_provider_secret
      resource:
        apiVersion: v1
        kind: Secret
        name: redis-password
        namespace: test-instance-02
  serviceAccountRef:
    name: test-instance-02-redis-secret-sync
  template: |
    local esp = import 'espejote.libsonnet';

    local context = esp.context();
    local managedBy = { 'espejote.io/managed-by': 'test-instance-02.redis-secret-sync' };
    local inDelete(obj) = std.get(obj.metadata, 'deletionTimestamp', '') != '';
    local source_secret_0 =
      local sources = context.source_secret_0;
      assert std.length(sources) == 1 : 'Expected exactly one secret redis-auth in namespace vshn-airlock-redis';
      assert !inDelete(sources[0]) : 'Secret redis-auth in namespace vshn-airlock-redis is being deleted';
      sources[0];
    local source_secret_1 =
      local sources = context.source_secret_1;
      assert std.length(sources) == 1 : 'Expected exactly one secret redis-tls in namespace vshn-airlock-redis';
      assert !inDelete(sources[0]) : 'Secret redis-tls in namespace vshn-airlock-redis is being deleted';
      sources[0];
    [
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-ca",
        namespace: "test-instance-02",
        labels: managedBy,
      },
      data: {
        "ca.crt": source_secret_1.data["ca.crt"]
      },
      type: "Opaque",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-clientcert",
        namespace: "test-instance-02",
        labels: managedBy,
      },
      data: {
        "tls.crt": source_secret_1.data["tls.crt"],
        "tls.key": source_secret_1.data["tls.key"]
      },
      type: "kubernetes.io/tls",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-merged",
        namespace: "test-instance-02",
        labels: managedBy,
      },
      data: {
        "ca.crt": source_secret_1.data["ca.crt"],
        "redis.username": source_secret_0.data["REDIS_USERNAME"],
        "tls.crt": source_secret_1.data["tls.crt"],
        "tls.key": source_secret_1.data["tls.key"]
      },
      type: "kubernetes.io/tls",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-password",
        namespace: "test-instance-02",
        labels: managedBy,
      },
      data: {
        "REDIS_HOST": source_secret_0.data["REDIS_HOST"],
        "REDIS_USERNAME": source_secret_0.data["REDIS_USERNAME"],
        "redis.password": source_secret_0.data["REDIS_PASSWORD"]
      },
      type: "Opaque",
    },

    ]
      + (if std.length(context.redis_provider) == 1 && std.length(context.redis_provider_secret) == 1 then [
        local redisProviderSecret = context.redis_provider_secret[0];
        {
          apiVersion: "microgateway.airlock.com/v1alpha1",
          kind: 'RedisProvider',
          metadata: {
            name: "test-instance-02",
            namespace: "test-instance-02",
          },
          spec: {
            mode: {
              standalone: {
                host: assert std.objectHas(redisProviderSecret.data, "REDIS_HOST") : "The secret referenced by the RedisProvider has no non-empty key REDIS_HOST";
                  local value = std.base64Decode(redisProviderSecret.data["REDIS_HOST"]);
                  assert std.length(value) > 0 : "The secret referenced by the RedisProvider has no non-empty key REDIS_HOST";
                  value,
              },
            },
          },
        }
      ] else [])
  triggers:
    - name: source_secret_0
      watchContextResource:
        name: source_secret_0
    - name: source_secret_1
      watchContextResource:
        name: source_secret_1
    - name: managed_secret
      watchResource:
        apiVersion: v1
        kind: Secret
        labelSelector:
          matchLabels:
            espejote.io/managed-by: test-instance-02.redis-secret-sync
        namespace: test-instance-02
    - name: redis_provider
      watchResource:
        apiVersion: microgateway.airlock.com/v1alpha1
        kind: RedisProvider
        name: test-instance-02
        namespace: test-instance-02
