apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    description: Copies the redis connection secrets into the airlock-microgateway
      instance namespace
  name: redis-secret-sync
  namespace: test-instance-01
spec:
  context:
    - name: source_secret_0
      resource:
        apiVersion: v1
        kind: Secret
        name: redis-creds-connection
        namespace: vshn-airlock-redis
  serviceAccountRef:
    name: test-instance-01-redis-secret-sync
  template: |
    local esp = import 'espejote.libsonnet';

    local context = esp.context();
    local managedBy = { 'espejote.io/managed-by': 'test-instance-01.redis-secret-sync' };

    [
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-ca",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "ca.crt": context.source_secret_0[0].data["ca.crt"]
      },
      type: "Opaque",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-clientcert",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "tls.crt": context.source_secret_0[0].data["tls.crt"],
        "tls.key": context.source_secret_0[0].data["tls.key"]
      },
      type: "kubernetes.io/tls",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-password",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "redis.password": context.source_secret_0[0].data["REDIS_PASSWORD"]
      },
      type: "Opaque",
    },

    ]
  triggers:
    - name: source_secret_0
      watchContextResource:
        name: source_secret_0
    - name: managed_secret
      watchResource:
        apiVersion: v1
        kind: Secret
        labelSelector:
          matchLabels:
            espejote.io/managed-by: test-instance-01.redis-secret-sync
        namespace: test-instance-01
