apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    description: Copies the redis connection secrets into the airlock-microgateway
      instance namespace
  name: redis-secret-sync
  namespace: test-instance-01
spec:
  context:
    - name: source_secret_0
      resource:
        apiVersion: v1
        kind: Secret
        name: redis-creds-connection
        namespace: vshn-airlock-redis
  serviceAccountRef:
    name: test-instance-01-redis-secret-sync
  template: |
    local esp = import 'espejote.libsonnet';

    local context = esp.context();
    local managedBy = { 'espejote.io/managed-by': 'test-instance-01.redis-secret-sync' };
    local inDelete(obj) = std.get(obj.metadata, 'deletionTimestamp', '') != '';
    local requiredKeys = [
        "REDIS_PASSWORD",
        "ca.crt",
        "tls.crt",
        "tls.key"
    ];
    local source_secret_0 =
      local sources = context.source_secret_0;
      assert std.length(sources) == 1 : "Expected exactly one secret redis-creds-connection in namespace vshn-airlock-redis";
      assert !inDelete(sources[0]) : "Secret redis-creds-connection in namespace vshn-airlock-redis is being deleted";
      assert std.all([std.objectHas(std.get(sources[0], 'data', {}), key) for key in requiredKeys]) : "Secret redis-creds-connection in namespace vshn-airlock-redis must contain keys REDIS_PASSWORD, ca.crt, tls.crt, tls.key";
      sources[0];

    [
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-password",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "redis.password": source_secret_0.data["REDIS_PASSWORD"]
      },
      type: "Opaque",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-ca",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "ca.crt": source_secret_0.data["ca.crt"]
      },
      type: "Opaque",
    },
    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: "redis-clientcert",
        namespace: "test-instance-01",
        labels: managedBy,
      },
      data: {
        "tls.crt": source_secret_0.data["tls.crt"],
        "tls.key": source_secret_0.data["tls.key"]
      },
      type: "kubernetes.io/tls",
    },

    ]
  triggers:
    - name: source_secret_0
      watchContextResource:
        name: source_secret_0
    - name: managed_secret
      watchResource:
        apiVersion: v1
        kind: Secret
        labelSelector:
          matchLabels:
            espejote.io/managed-by: test-instance-01.redis-secret-sync
        namespace: test-instance-01
