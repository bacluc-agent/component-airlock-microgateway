apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-instance-01-redis-secret-sync
  namespace: test-instance-01
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - microgateway.airlock.com
    resources:
      - redisproviders
    verbs:
      - get
      - list
      - patch
      - update
      - watch
