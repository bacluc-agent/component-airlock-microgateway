apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    name: airlock-microgateway-rules
  name: airlock-microgateway-rules
  namespace: vshn-airlock-monitoring
spec:
  groups:
    - name: blackboxExporter
      rules:
        - alert: IngressUnavailable
          annotations:
            description: Http check failed on {{ $labels.gateway }}
            runbook_url: runbook.url
            summary: Http check failed
          expr: probe_success{gateway=~"vshn-test-.*"} != 1
          for: 5m
          keep_firing_for: 10m
          labels:
            severity: critical
            syn: 'true'
            syn_component: monitoring
    - name: espejote
      rules:
        - alert: AirlockMicrogatewayEspejoteReconcileFailing
          annotations:
            description: 'The ManagedResource {{ $labels.managedresource }} in namespace
              {{ $labels.namespace }} has not been Ready for 30 minutes. Last reported
              status: {{ $labels.status }}. The full error message is in the ManagedResource
              events: kubectl -n {{ $labels.namespace }} describe managedresource
              {{ $labels.managedresource }}'
            summary: espejote failed to reconcile ManagedResource {{ $labels.managedresource
              }} in namespace {{ $labels.namespace }}
          expr: |
            label_replace(
              espejote_managedresource_status{status!="Ready", exported_namespace=~"test-instance-01|test-instance-02|vshn-airlock-monitoring"},
              "namespace", "$1", "exported_namespace", "(.*)"
            ) == 1
          for: 30m
          labels:
            severity: warning
            syn: 'true'
            syn_component: monitoring
    - name: sessionMonitoring
      rules:
        - alert: AirlockMicrogatewaySessionConnectionMonitoring
          annotations:
            description: '"Microgateway in {{ $labels.namespace }} has lost its connection
              to the SessionStore "'
            runbook_url: alert.rubook.com
            summary: Microgateway has lost its connection to the sessionStore (instance
              {{ $labels.instance }})
          expr: microgateway_session_store_connection_state{namespace="vshn-test"}
            != 1
          for: 2m
          keep_firing_for: 10m
          labels:
            severity: warning
            syn: 'true'
            syn_component: monitoring
