---
applications:
  - airlock-microgateway
  - cilium
  - gateway-api

parameters:
  # Dependency for testing with upstream lib
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-airlock-microgateway-operator/master/lib/airlock-microgateway-operator.libsonnet
        output_path: vendor/lib/airlock-microgateway-operator.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet

  airlock_microgateway:
    operatorNamespace: "test-operator-namespace"
    default:
      redisSecretSync:
        enabled: true
    instances:
      test-instance-01:
        redisProvider:
          spec:
            auth:
              password:
                secretRef:
                  name: redis-password

      test-instance-02:
        redisSecretSync:
          updateRedisProvider:
            username: false
          secrets:
            redis-old: redis-creds-connection-old
        redisProvider:
          spec:
            auth:
              password:
                secretRef:
                  name: redis-password
            tls:
              clientCertificate:
                secretRef:
                  name: redis-clientcert

      # Regression: secrets: null removes all sets, so no MR/RBAC is generated.
      test-instance-03:
        redisSecretSync:
          secrets: null
