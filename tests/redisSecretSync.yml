---
applications:
  - airlock-microgateway
  - cilium
  - gateway-api

parameters:
  # Dependency for testing with upstream lib
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-airlock-microgateway-operator/master/lib/airlock-microgateway-operator.libsonnet
        output_path: vendor/lib/airlock-microgateway-operator.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-gateway-api/master/lib/gateway-api.libsonnet
        output_path: vendor/lib/gateway-api.libsonnet

  airlock_microgateway:
    operatorNamespace: "test-operator-namespace"
    default:
      redisSecretSync:
        enabled: true
    instances:
      test-instance-01:
        redisProvider:
          spec:
            auth:
              password:
                secretRef:
                  name: redis-password
              username: default

      test-instance-02:
        redisSecretSync:
          updateRedisProvider:
            username: false
          secrets:
            redis-password:
              redis.password:
                secretName: redis-auth
                key: REDIS_PASSWORD
              REDIS_HOST:
                secretName: redis-auth
                key: REDIS_HOST
              REDIS_USERNAME:
                secretName: redis-auth
                key: REDIS_USERNAME
            redis-ca:
              ca.crt:
                secretName: redis-tls
                key: ca.crt
            redis-clientcert:
              type: kubernetes.io/tls
              tls.crt:
                secretName: redis-tls
                key: tls.crt
              tls.key:
                secretName: redis-tls
                key: tls.key
            redis-merged:
              type: kubernetes.io/tls
              redis.username:
                secretName: redis-auth
                key: REDIS_USERNAME
              ca.crt:
                secretName: redis-tls
                key: ca.crt
              tls.crt:
                secretName: redis-tls
                key: tls.crt
              tls.key:
                secretName: redis-tls
                key: tls.key
        redisProvider:
          spec:
            auth:
              password:
                secretRef:
                  name: redis-password
              username: default
            tls:
              clientCertificate:
                secretRef:
                  name: redis-clientcert

      test-instance-03:
        redisSecretSync:
          enabled: false

      test-instance-04:
        redisProvider:
          spec:
            auth:
              password:
                secretRef:
                  name: external-redis
