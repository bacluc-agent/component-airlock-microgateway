# Error case: the source secret does not exist in the source namespace.
triggers:
  - {}
context:
  - name: source_secret_0
    resources: []
  - name: redis_provider
    resources:
      - apiVersion: microgateway.airlock.com/v1alpha1
        kind: RedisProvider
        metadata:
          name: test-instance-01
          namespace: test-instance-01
        spec:
          auth:
            password:
              secretRef:
                name: redis-password
  - name: redis_provider_secret
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-password
          namespace: test-instance-01
        data:
          redis.password: cGFzc3dvcmQ=
          REDIS_HOST: cmVkaXMtbWFzdGVyLmV4YW1wbGU=
          REDIS_USERNAME: ZGVmYXVsdA==
        type: Opaque
libraries: {}
