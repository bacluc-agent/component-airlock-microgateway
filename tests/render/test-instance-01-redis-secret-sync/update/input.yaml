# Update case for test-instance-01: redis-password already exists with the old
# password, and the source secret now contains a new password.
triggers:
  - name: managed_secret
    watchResource:
      apiVersion: v1
      kind: Secret
      metadata:
        name: redis-password
        namespace: test-instance-01
        labels:
          espejote.io/managed-by: test-instance-01.redis-secret-sync
      data:
        redis.password: b2xkLXBhc3N3b3Jk
      type: Opaque
context:
  - name: source_secret_0
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-creds-connection
          namespace: vshn-airlock-redis
        data:
          REDIS_PASSWORD: bmV3LXBhc3N3b3Jk
          REDIS_HOST: cmVkaXMtbWFzdGVyLmV4YW1wbGU=
          REDIS_USERNAME: ZGVmYXVsdA==
          ca.crt: Y2E=
          tls.crt: Y3J0
          tls.key: a2V5
        type: Opaque
  - name: redis_provider
    resources:
      - apiVersion: microgateway.airlock.com/v1alpha1
        kind: RedisProvider
        metadata:
          name: test-instance-01
          namespace: test-instance-01
        spec:
          auth:
            password:
              secretRef:
                name: redis-password
  - name: redis_provider_secret
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-password
          namespace: test-instance-01
        data:
          redis.password: cGFzc3dvcmQ=
          REDIS_HOST: cmVkaXMtbWFzdGVyLmV4YW1wbGU=
          REDIS_USERNAME: ZGVmYXVsdA==
        type: Opaque
libraries: {}
