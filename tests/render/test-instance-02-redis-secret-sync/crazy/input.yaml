# Crazy case for test-instance-02: source data is split across an auth secret and
# a TLS secret. The default targets read from the matching source, and
# redis-merged combines keys from both sources.
triggers:
  - {}
context:
  - name: source_secret_0
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-auth
          namespace: vshn-airlock-redis
        data:
          REDIS_PASSWORD: cGFzc3dvcmQ=
          REDIS_USERNAME: dXNlcg==
        type: Opaque
  - name: source_secret_1
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-tls
          namespace: vshn-airlock-redis
        data:
          ca.crt: Y2E=
          tls.crt: Y3J0
          tls.key: a2V5
        type: Opaque
libraries: {}
