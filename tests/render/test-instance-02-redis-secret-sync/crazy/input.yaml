# Crazy case for test-instance-02: source data is split across an auth secret and
# a TLS secret. The default targets read from the matching source, and
# redis-merged combines keys from both sources.
triggers:
  - {}
context:
  - name: source_secret_0
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-auth
          namespace: vshn-airlock-redis
        data:
          REDIS_PASSWORD: cGFzc3dvcmQ=
          REDIS_HOST: Y3JhenkuZXhhbXBsZQ==
          REDIS_USERNAME: dXNlcg==
        type: Opaque
  - name: source_secret_1
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-tls
          namespace: vshn-airlock-redis
        data:
          ca.crt: Y2E=
          tls.crt: Y3J0
          tls.key: a2V5
        type: Opaque
  - name: redis_provider
    resources:
      - apiVersion: microgateway.airlock.com/v1alpha1
        kind: RedisProvider
        metadata:
          name: test-instance-02
          namespace: test-instance-02
        spec:
          auth:
            password:
              secretRef:
                name: redis-password
  - name: redis_provider_secret
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: redis-password
          namespace: test-instance-02
        data:
          redis.password: cGFzc3dvcmQ=
          REDIS_HOST: aW5zdGFuY2UuZXhhbXBsZQ==
        type: Opaque
libraries: {}
