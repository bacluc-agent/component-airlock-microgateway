name: Pull Request
on:
  pull_request:
    branches:
      - master
  push:

env:
  COMPONENT_NAME: airlock-microgateway

jobs:
  linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - lint_jsonnet
          - lint_yaml
          - lint_adoc
    steps:
      - uses: actions/checkout@v6
      - name: Run ${{ matrix.command }}
        run: make ${{ matrix.command }}
  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: snow-actions/eclint@v1.0.1
        with:
          args: 'check'
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance:
          - defaults
          - live_example_dev
          - multiple_instances
          - sessionStoreMonitoring
          - monitoring
          - redisSecretSync
    defaults:
      run:
        working-directory: ${{ env.COMPONENT_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ env.COMPONENT_NAME }}
      - name: Compile component
        run: make test -e instance=${{ matrix.instance }}
  golden:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance:
          - defaults
          - live_example_dev
          - multiple_instances
          - sessionStoreMonitoring
          - monitoring
          - redisSecretSync
    defaults:
      run:
        working-directory: ${{ env.COMPONENT_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ env.COMPONENT_NAME }}
      - name: Golden diff
        run: make golden-diff -e instance=${{ matrix.instance }}
  espejote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.COMPONENT_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ env.COMPONENT_NAME }}
      - name: Render espejote templates
        run: make test-espejote
